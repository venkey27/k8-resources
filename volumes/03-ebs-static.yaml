# PV is underlying srorage, PVC claims the stroage and POD is using the storage 

# PV:static provisioing -> we create disk manually and mount it
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static 
spec:
  accessModes:
    - ReadWriteOnce     # at a time only one node can access. pods in that node can access, # ReadWriteOnce because one laptop can only have on DISK
  capacity:
    storage: 2Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-0f09b807eeb503b42   # Replace with your actual AWS EBS Volume ID 

---
# PVC:dynamic provisioing -> k8 will create disk automatically
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static 
spec:
  storageClassName: ""
  volumeName: ebs-static
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  
---
# attaching POD to use PVC
apiVersion: v1
kind: Pod
metadata:
  name: ebs-static
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html     # THE DATA STORED IN THIS PATH(/usr/share/nginx/html) STORES IN EBS DISK (ELASTIC BLOCK STORE)
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-static
  # we are telling k8 to send POD TO us-east-1c NODE
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1c