apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  containers:
   # nginx container
  - image: nginx
    name: nginx
    # mounting nginx-logs volume to nginx container
    volumeMounts:
    - mountPath: /var/log/nginx
      name: nginx-logs
    # almalinux container
  - image: almalinux:9
    name: almalinux
    command: ["sleep", "1000"]
    # mounting nginx-logs volumme to almalinux container
    volumeMounts:
    - mountPath: /mnt/nginx-logs
      name: nginx-logs
      readOnly: true
  # volumes    
  volumes:
  - name: nginx-logs
    # this creates intially empty directory in the node where pod scheduled
    emptyDir:
      sizeLimit: 500Mi