#StorageClass: Defines how AWS should create volumes (e.g., volume type gp3, reclaim policy).

#PVC: Requests the storage (e.g., "I need 20GB").

#Pod: Tells Kubernetes to mount that PVC into a container directory (e.g., /data).

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-dynamic
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: roboshop-ebs
  resources:
    requests:
      storage: 6Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-dynamic
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-dynamic
